<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Carrinho | UZUU</title>
  <link rel="canonical" href="https://uzuu.com.br/carrinho/" />
  <meta name="theme-color" content="#050608" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="UZUU" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="../favicon.png?v=20260416b" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #050608;
    }

    body {
      margin: 0;
      background: #050608;
      font-family: "Outfit", Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useMemo, useState } = React;

    const initialItems = [
      {
        id: 1,
        name: "Camiseta Oversized UZUU Essential",
        variant: "Cor: Preta · Tamanho: G",
        price: 159.9,
        oldPrice: 199.9,
        qty: 1,
        stock: 8,
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=90",
      },
      {
        id: 2,
        name: "Calça Cargo Techwear UZUU",
        variant: "Cor: Preta · Tamanho: 42",
        price: 259.9,
        oldPrice: 319.9,
        qty: 1,
        stock: 5,
        image: "https://images.unsplash.com/photo-1473966968600-fa801b869a1a?auto=format&fit=crop&w=700&q=90",
      },
      {
        id: 3,
        name: "Moletom Hoodie UZUU Future",
        variant: "Cor: Preto · Tamanho: G",
        price: 249.9,
        oldPrice: 299.9,
        qty: 1,
        stock: 6,
        image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=700&q=90",
      },
    ];

    function money(value) {
      return Number(value || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL",
      });
    }

    function onlyDigits(value) {
      return String(value || "").replace(/\D+/g, "");
    }

    function formatCep(value) {
      const digits = onlyDigits(value).slice(0, 8);
      if (digits.length <= 5) return digits;
      return `${digits.slice(0, 5)}-${digits.slice(5)}`;
    }

    function estimateDeliveryByCep(value) {
      const digits = onlyDigits(value);
      if (digits.length !== 8) return null;

      const state = digits.startsWith("0") ? "São Paulo - SP" : "Brasil";
      const price = digits.startsWith("05876") ? 0 : 19.9;
      const days = price === 0 ? "1 a 3 dias úteis" : "3 a 7 dias úteis";

      return {
        cep: formatCep(digits),
        city: state,
        days,
        price,
      };
    }

    function Step({ number, title, subtitle, active, done }) {
      return (
        <div className="flex items-center gap-3">
          <div
            className={`flex h-10 w-10 items-center justify-center rounded-full border text-sm font-black ${
              done
                ? "border-blue-500 bg-blue-600 text-white"
                : active
                ? "border-blue-500 bg-blue-600 text-white shadow-lg shadow-blue-600/30"
                : "border-white/20 bg-white/5 text-neutral-500"
            }`}
          >
            {done ? "✓" : number}
          </div>
          <div className="hidden md:block">
            <p className={`text-sm font-black ${active ? "text-blue-400" : "text-neutral-400"}`}>{title}</p>
            <p className="text-xs text-neutral-500">{subtitle}</p>
          </div>
        </div>
      );
    }

    function QuantityControl({ value, onMinus, onPlus }) {
      return (
        <div className="inline-flex h-11 overflow-hidden rounded-xl border border-white/10 bg-[#111318]">
          <button onClick={onMinus} className="w-11 text-xl font-black text-neutral-300 transition hover:bg-white hover:text-black">
            −
          </button>
          <span className="flex w-12 items-center justify-center border-x border-white/10 text-sm font-black text-white">
            {value}
          </span>
          <button onClick={onPlus} className="w-11 text-xl font-black text-neutral-300 transition hover:bg-white hover:text-black">
            +
          </button>
        </div>
      );
    }

    function CarrinhoPremiumUZUU() {
      const savedCep = localStorage.getItem("uzuu_cart_cep") || "";
      const savedDeliveryQuote = estimateDeliveryByCep(savedCep);
      const [items, setItems] = useState(initialItems);
      const [coupon, setCoupon] = useState("");
      const [cep, setCep] = useState(savedDeliveryQuote ? savedDeliveryQuote.cep : "");
      const [couponApplied, setCouponApplied] = useState(false);
      const [couponFeedback, setCouponFeedback] = useState("");
      const [cepFeedback, setCepFeedback] = useState("");
      const [deliveryQuote, setDeliveryQuote] = useState(savedDeliveryQuote);

      const subtotal = useMemo(() => items.reduce((sum, item) => sum + item.price * item.qty, 0), [items]);
      const oldSubtotal = useMemo(() => items.reduce((sum, item) => item.oldPrice ? sum + item.oldPrice * item.qty : sum + item.price * item.qty, 0), [items]);
      const productDiscount = Math.max(0, oldSubtotal - subtotal);
      const couponDiscount = couponApplied ? subtotal * 0.1 : 0;
      const shippingGoal = 500;
      const hasFreeShippingByCep = !!deliveryQuote && deliveryQuote.price === 0;
      const hasFreeShipping = subtotal >= shippingGoal || hasFreeShippingByCep;
      const shippingMissing = hasFreeShipping ? 0 : Math.max(0, shippingGoal - subtotal);
      const shipping = hasFreeShipping ? 0 : deliveryQuote ? deliveryQuote.price : 19.9;
      const total = subtotal - couponDiscount + shipping;
      const progress = hasFreeShipping ? 100 : Math.min(100, (subtotal / shippingGoal) * 100);
      const totalDiscount = productDiscount + couponDiscount;
      const totalSaved = totalDiscount + (shipping === 0 ? 19.9 : 0);

      function updateQty(id, amount) {
        setItems((current) =>
          current.map((item) => {
            if (item.id !== id) return item;
            return { ...item, qty: Math.max(1, Math.min(item.stock, item.qty + amount)) };
          })
        );
      }

      function removeItem(id) {
        setItems((current) => current.filter((item) => item.id !== id));
      }

      function applyCoupon() {
        const code = coupon.trim().toUpperCase();
        if (!code) {
          setCouponApplied(false);
          setCouponFeedback("Digite um cupom para aplicar.");
          return;
        }

        if (code === "UZUU10") {
          setCouponApplied(true);
          setCoupon("UZUU10");
          setCouponFeedback("Cupom UZUU10 aplicado com sucesso.");
          return;
        }

        setCouponApplied(false);
        setCouponFeedback("Cupom inválido. Use UZUU10 para testar.");
      }

      function applyAvailableCoupon() {
        setCoupon("UZUU10");
        setCouponApplied(true);
        setCouponFeedback("Cupom UZUU10 aplicado com sucesso.");
      }

      function calculateCep() {
        const quote = estimateDeliveryByCep(cep);
        if (!quote) {
          setDeliveryQuote(null);
          setCepFeedback("Informe um CEP válido com 8 números.");
          return;
        }

        setCep(quote.cep);
        setDeliveryQuote(quote);
        setCepFeedback(`Entrega para ${quote.city}: ${quote.days}${quote.price === 0 ? " com frete grátis." : ` por ${money(quote.price)}.`}`);
        localStorage.setItem("uzuu_cart_cep", quote.cep);
        localStorage.setItem("uzuu_cart_delivery_city", quote.city);
      }

      return (
        <div className="min-h-screen bg-[#050608] text-white">
          <header className="border-b border-white/10 bg-black/95 px-5 py-4 backdrop-blur-xl">
            <div className="mx-auto flex max-w-7xl items-center justify-between gap-5">
              <div className="text-4xl font-black tracking-tight">UZUU</div>

              <nav className="hidden items-center gap-7 text-sm font-bold text-neutral-300 lg:flex">
                <button className="transition hover:text-white">Novidades</button>
                <button className="transition hover:text-white">Masculino</button>
                <button className="transition hover:text-white">Feminino</button>
                <button className="transition hover:text-white">Coleções</button>
                <button className="transition hover:text-white">Acessórios</button>
                <button className="font-black text-blue-500">Sale</button>
              </nav>

              <div className="hidden flex-1 md:block md:max-w-xl">
                <input
                  placeholder="Buscar produtos, categorias e muito mais..."
                  className="w-full rounded-2xl border border-white/10 bg-[#111318] px-5 py-3 text-sm text-white outline-none placeholder:text-neutral-500 focus:border-blue-500"
                />
              </div>

              <div className="flex items-center gap-4 text-sm font-black">
                <span className="hidden md:inline">Minha conta</span>
                <span className="hidden md:inline">♡ Favoritos</span>
                <span className="relative">
                  🛍 Carrinho
                  <b className="absolute -right-4 -top-3 flex h-5 w-5 items-center justify-center rounded-full bg-blue-600 text-[10px] text-white">
                    {items.length}
                  </b>
                </span>
              </div>
            </div>
          </header>

          <div className="border-b border-white/10 bg-[#0b0d11] px-5 py-4">
            <div className="mx-auto flex max-w-7xl items-center justify-between gap-4">
              <Step number="1" title="Carrinho" subtitle="Revisão dos itens" active />
              <div className="hidden h-px flex-1 bg-white/10 md:block" />
              <Step number="2" title="Identificação" subtitle="Seus dados" />
              <div className="hidden h-px flex-1 bg-white/10 md:block" />
              <Step number="3" title="Pagamento" subtitle="Escolha a forma" />
              <div className="hidden h-px flex-1 bg-white/10 md:block" />
              <Step number="4" title="Confirmação" subtitle="Finalize seu pedido" />
            </div>
          </div>

          <main className="mx-auto grid max-w-7xl gap-6 px-5 py-6 lg:grid-cols-[1fr,390px]">
            <section className="space-y-4">
              <div className="rounded-3xl border border-white/10 bg-[#101216] p-5 shadow-2xl shadow-black/30">
                <div className="flex items-center justify-between gap-4">
                  <div className="flex items-center gap-4">
                    <div className="flex h-12 w-12 items-center justify-center rounded-2xl border border-blue-500/30 bg-blue-600/15 text-2xl">🚚</div>
                    <div>
                      <p className="text-sm text-neutral-300">
                        {hasFreeShipping ? (
                          <>Parabéns! Você ganhou <b className="text-blue-400">FRETE GRÁTIS</b> para todo o Brasil.</>
                        ) : (
                          <>Falta <b className="text-blue-400">{money(shippingMissing)}</b> para ganhar <b className="text-blue-400">FRETE GRÁTIS</b>.</>
                        )}
                      </p>
                      <div className="mt-3 h-2 overflow-hidden rounded-full bg-white/10">
                        <div className="h-full rounded-full bg-blue-600" style={{ width: `${progress}%` }} />
                      </div>
                    </div>
                  </div>
                  <p className="hidden text-sm font-bold text-neutral-400 md:block">
                    {money(subtotal)} / {money(shippingGoal)}
                  </p>
                </div>
              </div>

              <div className="space-y-3">
                {items.map((item) => (
                  <article key={item.id} className="rounded-3xl border border-white/10 bg-[#101216] p-4 shadow-2xl shadow-black/20">
                    <div className="grid gap-4 md:grid-cols-[150px,1fr,150px,130px] md:items-center">
                      <div className="h-36 overflow-hidden rounded-2xl bg-neutral-900 md:h-28">
                        <img src={item.image} alt={item.name} className="h-full w-full object-cover" />
                      </div>

                      <div>
                        <h2 className="text-lg font-black text-white">{item.name}</h2>
                        <p className="mt-2 text-sm text-neutral-400">{item.variant}</p>
                        <div className="mt-3 flex flex-wrap gap-3 text-xs font-bold">
                          <span className="text-emerald-400">✓ Em estoque</span>
                          <span className="text-neutral-500">Envio em até 24h</span>
                          <span className="text-blue-400">Restam {item.stock}</span>
                        </div>
                      </div>

                      <div className="md:text-center">
                        <QuantityControl
                          value={item.qty}
                          onMinus={() => updateQty(item.id, -1)}
                          onPlus={() => updateQty(item.id, 1)}
                        />
                      </div>

                      <div className="md:text-right">
                        <p className="text-xl font-black text-white">{money(item.price * item.qty)}</p>
                        <p className="text-xs text-neutral-500 line-through">{money(item.oldPrice * item.qty)}</p>
                        <button onClick={() => removeItem(item.id)} className="mt-4 text-sm font-bold text-neutral-500 transition hover:text-red-400">
                          🗑 Remover
                        </button>
                      </div>
                    </div>
                  </article>
                ))}
              </div>

              <div className="grid gap-4 md:grid-cols-2">
                <div className="rounded-3xl border border-white/10 bg-[#101216] p-5">
                  <div className="mb-4 flex items-center gap-3">
                    <div className="text-2xl">🏷</div>
                    <h3 className="text-xl font-black">Cupom de desconto</h3>
                  </div>
                  <div className="flex gap-3">
                    <input
                      value={coupon}
                      onChange={(event) => {
                        setCoupon(event.target.value);
                        setCouponApplied(false);
                        setCouponFeedback("");
                      }}
                      onKeyDown={(event) => {
                        if (event.key === "Enter") applyCoupon();
                      }}
                      placeholder="Digite seu cupom"
                      className="min-w-0 flex-1 rounded-xl border border-white/10 bg-black px-4 py-3 text-sm uppercase outline-none placeholder:text-neutral-600 focus:border-blue-500"
                    />
                    <button type="button" onClick={applyCoupon} className="rounded-xl border border-blue-500 bg-blue-600/10 px-5 py-3 text-sm font-black text-blue-400 transition hover:bg-blue-600 hover:text-white">
                      Aplicar
                    </button>
                  </div>
                  {couponFeedback && <p className={`mt-3 text-xs font-bold ${couponApplied ? "text-emerald-400" : "text-blue-300"}`}>{couponFeedback}</p>}
                  <button type="button" onClick={applyAvailableCoupon} className="mt-3 text-xs font-black text-blue-400">VER CUPONS DISPONÍVEIS</button>
                </div>

                <div className="rounded-3xl border border-white/10 bg-[#101216] p-5">
                  <div className="mb-4 flex items-center gap-3">
                    <div className="text-2xl">🚚</div>
                    <h3 className="text-xl font-black">Estimativa de entrega</h3>
                  </div>
                  <div className="flex gap-3">
                    <input
                      value={cep}
                      onChange={(event) => {
                        setCep(formatCep(event.target.value));
                        setCepFeedback("");
                      }}
                      onKeyDown={(event) => {
                        if (event.key === "Enter") calculateCep();
                      }}
                      placeholder="Digite seu CEP"
                      className="min-w-0 flex-1 rounded-xl border border-white/10 bg-black px-4 py-3 text-sm outline-none placeholder:text-neutral-600 focus:border-blue-500"
                    />
                    <button type="button" onClick={calculateCep} className="rounded-xl border border-blue-500 bg-blue-600/10 px-5 py-3 text-sm font-black text-blue-400 transition hover:bg-blue-600 hover:text-white">
                      Calcular
                    </button>
                  </div>
                  {cepFeedback && <p className={`mt-3 text-xs font-bold ${deliveryQuote ? "text-emerald-400" : "text-blue-300"}`}>{cepFeedback}</p>}
                  <button type="button" onClick={() => window.open("https://buscacepinter.correios.com.br/app/endereco/index.php", "_blank", "noopener,noreferrer")} className="mt-3 text-xs font-black text-blue-400">NÃO SEI MEU CEP · BUSCAR CEP</button>
                </div>
              </div>

              <div className="grid gap-3 border-t border-white/10 pt-6 text-center text-sm text-neutral-400 md:grid-cols-3">
                <div>🛡 <b className="text-white">30 dias</b> para trocas e devoluções</div>
                <div>🎧 Atendimento premium: <b className="text-white">(11) 4002-8922</b></div>
                <div>⭐ UZUU · Streetwear feito para quem vive o agora</div>
              </div>
            </section>

            <aside className="space-y-4 lg:sticky lg:top-6 lg:self-start">
              <div className="rounded-3xl border border-white/10 bg-[#101216] p-5 shadow-2xl shadow-black/40">
                <h2 className="text-2xl font-black">Resumo do pedido</h2>

                <div className="mt-5 rounded-3xl border border-white/10 bg-black/40 p-4">
                  <div className="flex items-center gap-3">
                    <div className="flex h-12 w-12 items-center justify-center rounded-2xl bg-blue-600 text-xl">🚚</div>
                    <div className="flex-1">
                      <p className="text-sm font-black text-white">
                        {hasFreeShipping ? "Parabéns! Você ganhou FRETE GRÁTIS!" : "Continue comprando para ganhar frete grátis"}
                      </p>
                      <div className="mt-3 h-2 overflow-hidden rounded-full bg-white/10">
                        <div className="h-full rounded-full bg-blue-600" style={{ width: `${progress}%` }} />
                      </div>
                    </div>
                  </div>
                  <div className="mt-4 flex justify-between text-sm text-neutral-400">
                    <span>{deliveryQuote ? `${deliveryQuote.city} · ${deliveryQuote.days}` : "Envio para todo o Brasil"}</span>
                    <span className="font-black text-blue-400">{hasFreeShipping || shipping === 0 ? "Grátis" : money(shipping)}</span>
                  </div>
                </div>

                <div className="mt-5 space-y-3 border-b border-white/10 pb-5 text-sm text-neutral-300">
                  <div className="flex justify-between"><span>Subtotal ({items.length} itens)</span><span>{money(subtotal)}</span></div>
                  <div className="flex justify-between"><span>Desconto</span><span className="text-emerald-400">- {money(totalDiscount)}</span></div>
                  <div className="flex justify-between"><span>Frete</span><span className="font-black text-emerald-400">{hasFreeShipping ? "Grátis" : money(shipping)}</span></div>
                </div>

                <div className="mt-5 flex items-end justify-between">
                  <p className="text-2xl font-black">Total</p>
                  <p className="text-3xl font-black text-blue-500">{money(total)}</p>
                </div>

                <p className="mt-2 text-center text-sm font-bold text-emerald-400">
                  Você está economizando {money(totalSaved)}
                </p>

                <button className="mt-5 w-full rounded-2xl bg-blue-600 py-4 text-lg font-black text-white shadow-2xl shadow-blue-600/30 transition hover:scale-[1.01] hover:bg-blue-700">
                  Ir para pagamento ›
                </button>

                <button className="mt-3 w-full rounded-2xl border border-blue-500/60 py-4 text-base font-black text-blue-400 transition hover:bg-blue-600 hover:text-white">
                  Continuar comprando
                </button>
              </div>

              <div className="grid grid-cols-3 gap-3 rounded-3xl border border-white/10 bg-[#101216] p-4 text-center text-xs text-neutral-400">
                <div>
                  <div className="mx-auto mb-2 flex h-10 w-10 items-center justify-center rounded-full bg-blue-600/20 text-blue-400">🛡</div>
                  <b className="text-white">Compra segura</b>
                  <p>Dados protegidos</p>
                </div>
                <div>
                  <div className="mx-auto mb-2 flex h-10 w-10 items-center justify-center rounded-full bg-blue-600/20 text-blue-400">🚚</div>
                  <b className="text-white">Frete grátis</b>
                  <p>Em compras acima de R$ 500</p>
                </div>
                <div>
                  <div className="mx-auto mb-2 flex h-10 w-10 items-center justify-center rounded-full bg-blue-600/20 text-blue-400">🔒</div>
                  <b className="text-white">Pagamento protegido</b>
                  <p>Ambiente certificado</p>
                </div>
              </div>

              <div className="rounded-3xl border border-white/10 bg-[#101216] p-5">
                <p className="text-sm font-black">Formas de pagamento aceitas</p>
                <div className="mt-4 flex flex-wrap gap-2">
                  {["PIX", "VISA", "Mastercard", "Elo", "Hipercard"].map((card) => (
                    <span key={card} className="rounded-xl border border-white/10 bg-black px-3 py-2 text-xs font-black text-neutral-300">
                      {card}
                    </span>
                  ))}
                </div>
              </div>
            </aside>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<CarrinhoPremiumUZUU />);
  </script>
</body>
</html>

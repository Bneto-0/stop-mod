<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Processando | Uzuu</title>
    <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="UZUU" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="apple-touch-icon" href="/favicon.png?v=20260423home" />
  <link rel="manifest" href="/site.webmanifest?v=20260430blackapp1" />
  <link rel="icon" href="../../favicon.png?v=20260416b" type="image/png" />
  <link rel="stylesheet" href="../../style.css?v=20260501darksweep2" />
<link rel="stylesheet" href="/assets/site-header.css?v=29" />
</head>
<body>
  <div id="site-header-root"></div>
<script src="/assets/site-header.js?v=17"></script>
  <script src="../../assets/catalog.js?v=11"></script>

  <main class="page-shell container">
    <section class="page-card">
      <p class="eyebrow">Pedidos</p>
      <h1>Pedidos em processamento</h1>
      <div id="processing-list" class="page-stack"></div>
    </section>
  </main>

  <script>
    const catalog = window.stopmodCatalog || null;
    const container = document.getElementById("processing-list");

    function normalizeProfileEmail() {
      const profile = typeof catalog?.loadProfile === "function" ? catalog.loadProfile() : {};
      return String(profile?.email || "").trim().toLowerCase();
    }

    function loadOrders() {
      return typeof catalog?.loadOrders === "function" ? catalog.loadOrders() : [];
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function money(value) {
      return `R$ ${Number(value || 0).toFixed(2).replace('.', ',')}`;
    }

    function isProcessingOrder(order) {
      const apiStatus = String(order?.apiStatus || "").trim().toLowerCase();
      if (["awaiting_payment", "paid", "preparing", "shipped"].includes(apiStatus)) return true;

      const text = String(order?.status || order?.tracking?.status || "").trim().toLowerCase();
      return /aguardando|processando|preparo|transporte|enviado/.test(text);
    }

    function renderOrders() {
      const userEmail = normalizeProfileEmail();
      if (!userEmail) {
        container.innerHTML = '<article class="helper-card"><strong>Entre na sua conta</strong><p>Faca login para acompanhar pedidos em andamento.</p><a class="btn secondary" href="../../login/">Entrar</a></article>';
        return;
      }

      const filtered = loadOrders().filter((order) => {
        const ownerEmail = String(order?.ownerEmail || "").trim().toLowerCase();
        return ownerEmail === userEmail && isProcessingOrder(order);
      });

      container.innerHTML = filtered.length
        ? filtered.map((order) => `
            <article class="helper-card">
              <h3>${escapeHtml(order.referenceId || order.id || "Pedido")}</h3>
              <p>Status: ${escapeHtml(order.status || order.tracking?.status || "Processando")}</p>
              <p>Total: ${escapeHtml(money(order?.totals?.total || 0))}</p>
              <a class="btn secondary" href="../pedidos/">Acompanhar pedido</a>
            </article>
          `).join("")
        : "<p>Nenhum pedido em processamento no momento.</p>";
    }

    async function bootstrapProcessing() {
      if (typeof catalog?.syncOrdersFromApi === "function") {
        await catalog.syncOrdersFromApi();
      }
      renderOrders();
    }

    document.addEventListener(catalog?.events?.ordersUpdated || "uzuu:orders-updated", renderOrders);
    bootstrapProcessing();
  </script>
<div id="site-footer-root"></div>
<script src="/assets/site-footer.js?v=2"></script>
</body>
</html>
